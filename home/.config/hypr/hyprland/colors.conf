general {
    col.active_border = rgba(cac5c777)
    col.inactive_border = rgba(f8f2f433)
}

misc {
    background_color = rgba(141314FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(fef8f9FF)
        col.text = rgba(1d1b1cFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(1d1b1c), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(1d1b1c), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(1d1b1c), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrule = border_color rgba(665a69AA) rgba(665a6977), match:pin 1
